<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main brain outline -->
  <path d="M 150 80 
           C 120 80, 100 100, 100 130
           C 100 160, 120 180, 150 180
           C 180 180, 200 160, 200 130
           C 200 100, 180 80, 150 80 Z" 
        fill="url(#brainGradient)" 
        stroke="#6c757d" 
        stroke-width="2"
        filter="url(#shadow)"/>
  
  <!-- Left hemisphere -->
  <path d="M 150 80
           C 180 80, 200 100, 200 130
           C 200 160, 180 180, 150 180
           C 180 180, 220 200, 240 230
           C 260 260, 260 300, 240 330
           C 220 360, 180 380, 150 380
           C 120 380, 80 360, 60 330
           C 40 300, 40 260, 60 230
           C 80 200, 120 180, 150 180
           C 120 180, 100 160, 100 130
           C 100 100, 120 80, 150 80 Z" 
        fill="url(#brainGradient)" 
        stroke="#6c757d" 
        stroke-width="2"/>
  
  <!-- Right hemisphere -->
  <path d="M 350 80
           C 320 80, 300 100, 300 130
           C 300 160, 320 180, 350 180
           C 380 180, 400 160, 400 130
           C 400 100, 380 80, 350 80
           C 380 80, 420 100, 440 130
           C 460 160, 460 200, 440 230
           C 420 260, 380 280, 350 280
           C 320 280, 300 260, 300 230
           C 300 200, 320 180, 350 180
           C 320 180, 300 160, 300 130
           C 300 100, 320 80, 350 80 Z" 
        fill="url(#brainGradient)" 
        stroke="#6c757d" 
        stroke-width="2"/>
  
  <!-- Brain stem -->
  <ellipse cx="250" cy="380" rx="30" ry="15" 
           fill="#6c757d" 
           stroke="#495057" 
           stroke-width="1"/>
  
  <!-- Sulci (brain folds) -->
  <path d="M 120 100 Q 140 110 160 100" stroke="#adb5bd" stroke-width="1" fill="none"/>
  <path d="M 120 120 Q 140 130 160 120" stroke="#adb5bd" stroke-width="1" fill="none"/>
  <path d="M 120 140 Q 140 150 160 140" stroke="#adb5bd" stroke-width="1" fill="none"/>
  <path d="M 120 160 Q 140 170 160 160" stroke="#adb5bd" stroke-width="1" fill="none"/>
  
  <path d="M 340 100 Q 360 110 380 100" stroke="#adb5bd" stroke-width="1" fill="none"/>
  <path d="M 340 120 Q 360 130 380 120" stroke="#adb5bd" stroke-width="1" fill="none"/>
  <path d="M 340 140 Q 360 150 380 140" stroke="#adb5bd" stroke-width="1" fill="none"/>
  <path d="M 340 160 Q 360 170 380 160" stroke="#adb5bd" stroke-width="1" fill="none"/>
  
  <!-- Central sulcus -->
  <path d="M 240 80 Q 250 90 260 80" stroke="#adb5bd" stroke-width="2" fill="none"/>
  <path d="M 240 100 Q 250 110 260 100" stroke="#adb5bd" stroke-width="2" fill="none"/>
  <path d="M 240 120 Q 250 130 260 120" stroke="#adb5bd" stroke-width="2" fill="none"/>
  <path d="M 240 140 Q 250 150 260 140" stroke="#adb5bd" stroke-width="2" fill="none"/>
  <path d="M 240 160 Q 250 170 260 160" stroke="#adb5bd" stroke-width="2" fill="none"/>
  
  <!-- Additional brain details -->
  <circle cx="180" cy="110" r="3" fill="#6c757d"/>
  <circle cx="320" cy="110" r="3" fill="#6c757d"/>
  <circle cx="200" cy="150" r="2" fill="#6c757d"/>
  <circle cx="300" cy="150" r="2" fill="#6c757d"/>
  <circle cx="220" cy="190" r="2" fill="#6c757d"/>
  <circle cx="280" cy="190" r="2" fill="#6c757d"/>
</svg> 